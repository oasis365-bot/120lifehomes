<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시설 검색 | 120 라이프홈즈</title>
<meta name="description" content="지역과 시설 유형, 기관명으로 전국 장기요양기관을 검색합니다. 국민건강보험공단 공공데이터 기반.">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=20260901f">
</head>
<body style="font-family:'Noto Sans KR',sans-serif">
<div id="chrome-header"></div>

<main class="wrap">
  <div class="breadcrumb"><a href="index.html">홈</a> › 시설 검색</div>

  <div class="search-layout">
    <aside class="filters">
      <h3>검색 조건</h3>
      <form id="filterForm" onsubmit="return false">
        <div class="filter-group">
          <label class="grp" for="fRegion">지역 (시도)</label>
          <select id="fRegion" onchange="fillSigungu()" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-family:inherit">
            <option value="">전체 지역</option>
          </select>
          <label class="grp" for="fSigungu" style="margin-top:8px">시·군·구</label>
          <select id="fSigungu" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-family:inherit">
            <option value="">전체</option>
          </select>
        </div>

        <div class="filter-group">
          <label class="grp">시설 유형</label>
          <div id="fTypes"></div>
        </div>

        <div class="filter-group">
          <label class="grp" for="fGrade">평가등급</label>
          <select id="fGrade" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-family:inherit">
            <option value="">전체</option>
            <option value="A">A (최우수)</option>
            <option value="B">B (우수)</option>
            <option value="C">C (양호)</option>
            <option value="D">D (보통)</option>
            <option value="E">E (미흡)</option>
          </select>
        </div>

        <div class="filter-group">
          <label class="grp" for="fq">기관명 검색</label>
          <input id="fq" type="text" placeholder="예) 행복요양원" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-family:inherit">
        </div>

        <button type="button" class="btn btn-green btn-block" onclick="applyFilters()">이 조건으로 검색</button>
        <button type="button" class="btn btn-ghost btn-block" style="margin-top:8px" onclick="resetFilters()">조건 초기화</button>
      </form>
      <p style="font-size:.78rem;color:var(--gray);margin-top:14px;line-height:1.6">
        국민건강보험공단 공공데이터 기반 (주소·정원·평가등급 포함). 실시간 공실은 시설 확인이 필요합니다.
      </p>
    </aside>

    <section>
      <div class="results-head">
        <div class="count">검색 결과 <strong id="count">–</strong>곳</div>
        <div>
          <label for="sort" style="font-size:.85rem;color:var(--gray)">정렬</label>
          <select id="sort" onchange="applyFilters()" style="padding:8px;border:1px solid var(--line);border-radius:8px;font-family:inherit">
            <option value="name">기관명순</option>
            <option value="new">최근 지정순</option>
          </select>
        </div>
      </div>
      <div class="facility-list" id="list"></div>
      <p id="status" style="padding:30px;text-align:center;color:var(--gray)">조건을 선택하고 검색하세요.</p>
      <div id="pager" style="display:none;text-align:center;margin:24px 0">
        <button class="btn btn-ghost" id="moreBtn" onclick="loadMore()">더 보기</button>
      </div>
    </section>
  </div>
</main>

<div id="chrome-footer"></div>

<script src="assets/js/regioncodes.js?v=20260901f"></script>
<script src="assets/js/data.js?v=20260901f"></script>
<script src="assets/js/app.js?v=20260901f"></script>
<script>
  mountChrome("search");
  const params = qs();

  const fRegion = document.getElementById("fRegion");
  const fSigungu = document.getElementById("fSigungu");

  // 시도별 시군구 인덱스
  const SGG_BY_SIDO = {};
  for (const [code, name] of Object.entries(SIGUNGU)) {
    const cd2 = code.slice(0, 2);
    (SGG_BY_SIDO[cd2] = SGG_BY_SIDO[cd2] || []).push([code, name]);
  }
  Object.values(SGG_BY_SIDO).forEach(a => a.sort((x, y) => x[1].localeCompare(y[1], "ko")));

  function fillSigungu(keep) {
    const r = REGIONS.find(x => x.name === fRegion.value);
    fSigungu.innerHTML = '<option value="">전체</option>';
    if (r && SGG_BY_SIDO[r.cd]) {
      const seen = new Set();
      SGG_BY_SIDO[r.cd].forEach(([code, name]) => {
        if (seen.has(name)) return; seen.add(name);
        fSigungu.add(new Option(name, name));   // 값 = 시군구 이름 (sigungu_nm)
      });
    }
    if (keep) fSigungu.value = keep;
  }
  window.fillSigungu = fillSigungu;
  REGIONS.forEach(r => {
    const label = r.count ? `${r.name} (${r.count.toLocaleString()})` : `${r.name} (준비중)`;
    fRegion.add(new Option(label, r.name));
  });
  document.getElementById("fTypes").innerHTML = FACILITY_TYPES.map(t =>
    `<label class="opt"><input type="radio" name="ftype" value="${t.name}"> ${t.label}</label>`).join("") +
    `<label class="opt"><input type="radio" name="ftype" value="" checked> 전체 유형</label>`;

  // URL 파라미터 반영
  if (params.sido) fRegion.value = params.sido;
  if (params.region) fRegion.value = params.region;
  fillSigungu(params.sigungu_nm || params.sigungu);
  if (params.type) {
    const rb = [...document.querySelectorAll('input[name="ftype"]')].find(x => x.value === params.type);
    if (rb) rb.checked = true;
  }
  if (params.grade) document.getElementById("fGrade").value = params.grade;
  if (params.q) document.getElementById("fq").value = params.q;

  let page = 1, done = false, loading = false, total = 0;

  function currentQuery() {
    const type = (document.querySelector('input[name="ftype"]:checked') || {}).value || "";
    return {
      sido: fRegion.value || "",
      sigungu_nm: fSigungu.value || "",
      grade: document.getElementById("fGrade").value || "",
      type,
      q: document.getElementById("fq").value.trim(),
      sort: document.getElementById("sort").value,
    };
  }

  function buildUrl(q, pg) {
    const u = new URLSearchParams();
    if (q.sido) u.set("sido", q.sido);
    if (q.sigungu_nm) u.set("sigungu_nm", q.sigungu_nm);
    if (q.grade) u.set("grade", q.grade);
    if (q.type) u.set("type", q.type);
    if (q.q) u.set("q", q.q);
    u.set("sort", q.sort);
    u.set("page", pg);
    u.set("size", "20");
    return "/api/facilities?" + u.toString();
  }

  async function fetchPage(reset) {
    if (loading) return;
    loading = true;
    const q = currentQuery();
    if (reset) { page = 1; done = false; document.getElementById("list").innerHTML = ""; }
    document.getElementById("status").style.display = "block";
    document.getElementById("status").textContent = "불러오는 중…";
    try {
      const r = await fetch(buildUrl(q, page));
      const data = await r.json();
      if (data.error) throw new Error(data.error);
      const items = data.items || [];
      total = data.total != null ? data.total : total;
      document.getElementById("count").textContent = (total != null ? total : items.length).toLocaleString();
      document.getElementById("list").insertAdjacentHTML("beforeend", items.map(facilityCardHTML).join(""));
      if (items.length < 20) done = true;
      const listCount = document.getElementById("list").children.length;
      document.getElementById("status").style.display = listCount ? "none" : "block";
      if (!listCount) document.getElementById("status").textContent = "조건에 맞는 기관이 없습니다. 조건을 완화해 보세요.";
      document.getElementById("pager").style.display = (!done && listCount) ? "block" : "none";
    } catch (e) {
      console.error(e);
      document.getElementById("status").style.display = "block";
      document.getElementById("status").textContent = "일시적 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.";
    }
    loading = false;
  }

  function applyFilters() {
    const q = currentQuery();
    const u = new URLSearchParams();
    if (q.sido) u.set("sido", q.sido);
    if (q.sigungu_nm) u.set("sigungu_nm", q.sigungu_nm);
    if (q.grade) u.set("grade", q.grade);
    if (q.type) u.set("type", q.type);
    if (q.q) u.set("q", q.q);
    history.replaceState(null, "", "search.html?" + u.toString());
    fetchPage(true);
  }
  function resetFilters() {
    document.getElementById("filterForm").reset();
    document.querySelector('input[name="ftype"][value=""]').checked = true;
    fillSigungu();
    history.replaceState(null, "", "search.html");
    fetchPage(true);
  }
  function loadMore() { if (!done) { page += 1; fetchPage(false); } }
  window.applyFilters = applyFilters;
  window.resetFilters = resetFilters;
  window.loadMore = loadMore;

  // 최초 로드: 파라미터가 있으면 바로 검색, 없으면 안내
  if (params.sido || params.region || params.sigungu || params.sigungu_nm || params.grade || params.type || params.q) applyFilters();
  else fetchPage(true);
</script>
</body>
</html>
