<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시설 상세 | 120 라이프홈즈</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body style="font-family:'Noto Sans KR',sans-serif">
<div id="chrome-header"></div>

<main id="detail"><div class="wrap" style="padding:60px 20px;text-align:center;color:var(--gray)">불러오는 중…</div></main>

<div id="chrome-footer"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
  mountChrome("");
  const id = qs().id;
  const root = document.getElementById("detail");

  render();
  async function render() {
    if (!id) return notFound();
    let f;
    try {
      const r = await fetch("/api/facility?id=" + encodeURIComponent(id));
      if (!r.ok) return notFound();
      const data = await r.json();
      f = data.item;
      if (!f) return notFound();
    } catch (e) { return notFound(); }

    document.title = `${f.name} | 120 라이프홈즈`;
    const c = typeColor(f.type_label);
    const region = [f.sido].filter(Boolean).join(" ");
    const kwByType = FACILITY_TYPES.find(t => t.name === f.type_label);

    root.innerHTML = `
    <div class="detail-hero"><div class="wrap">
      <div class="breadcrumb"><a href="index.html">홈</a> › <a href="search.html?sido=${encodeURIComponent(f.sido||'')}">${esc(region)}</a> › <a href="search.html?type=${encodeURIComponent(f.type_label||'')}">${esc(f.type_label||'장기요양기관')}</a> › ${esc(f.name)}</div>
      <div class="type-label">${esc(f.type_label || '장기요양기관')}</div>
      <h1>${esc(f.name)}</h1>
      <div style="color:var(--gray)">${esc(region)}${f.address ? ' · ' + esc(f.address) : ''}</div>
    </div></div>

    <div class="wrap"><div class="detail-grid">
      <div class="detail-main">
        <div class="gallery">
          <div style="background:linear-gradient(135deg,${c},${c}bb)"></div>
          <div style="background:${c}88"></div><div style="background:${c}66"></div>
          <div style="background:${c}aa"></div><div style="background:${c}55"></div>
        </div>

        <div class="detail-section">
          <h2>기본 정보</h2>
          <table class="spec-table">
            <tr><th>기관명</th><td>${esc(f.name)}</td></tr>
            <tr><th>유형</th><td>${esc(f.type_label || '장기요양기관')} <span style="color:var(--gray);font-size:.85rem">(코드 ${esc(f.type_code||'-')})</span></td></tr>
            <tr><th>지역</th><td>${esc(region)}</td></tr>
            <tr><th>장기요양기관기호</th><td>${esc(f.id)}</td></tr>
            <tr><th>지정일</th><td>${f.established_at ? ymd(f.established_at) : '-'}</td></tr>
            <tr><th>주소</th><td>${f.address ? esc(f.address) : '<span style="color:var(--gray)">상세 주소는 보강 중입니다</span>'}</td></tr>
            <tr><th>전화</th><td>${f.phone ? esc(f.phone) : '<span style="color:var(--gray)">보강 중</span>'}</td></tr>
          </table>
          ${kwByType ? `<p style="margin-top:12px;color:var(--gray);font-size:.95rem">${kwByType.desc}</p>` : ''}
        </div>

        <div class="detail-section">
          <h2>상세 정보 (보강 예정)</h2>
          <p style="color:var(--gray)">
            정원·현원, 평가등급, 프로그램, 인력 현황, 월 비용 등 상세 정보는
            국민건강보험공단 상세조회 데이터 연동으로 순차 제공될 예정입니다.
            지금 필요하시면 아래 <strong>견학·상담 신청</strong>을 이용해 주세요 — 상담원이 직접 확인해 드립니다.
          </p>
          <table class="spec-table" style="margin-top:10px">
            <tr><th>정원 / 현원</th><td>준비중</td></tr>
            <tr><th>평가등급</th><td>준비중</td></tr>
            <tr><th>월 이용료(예상)</th><td>준비중</td></tr>
          </table>
        </div>

        <div class="detail-section">
          <h2>이용 안내</h2>
          <p style="color:var(--gray)">
            장기요양 1~5등급 또는 인지지원등급 판정을 받은 어르신이 이용할 수 있습니다.
            등급이 없다면 <a href="guide.html" style="color:var(--green);font-weight:700">장기요양등급 신청</a>을 먼저 진행하세요.
          </p>
        </div>
      </div>

      <aside>
        <div class="aside-card">
          <div style="color:var(--gray);font-size:.85rem">${esc(f.type_label || '장기요양기관')}</div>
          <div style="font-size:1.4rem;font-weight:800;margin:4px 0 12px">${esc(f.name)}</div>
          <ul class="mini">
            <li><span>지역</span><strong>${esc(region)}</strong></li>
            <li><span>지정일</span><strong>${f.established_at ? ymd(f.established_at) : '-'}</strong></li>
            <li><span>기관기호</span><strong>${esc(f.id)}</strong></li>
          </ul>
          <a href="consult.html?facility=${encodeURIComponent(f.name)}" class="btn btn-primary btn-block">견학 · 상담 신청</a>
          <a href="consult.html" class="btn btn-ghost btn-block" style="margin-top:8px">전화 상담 1600-0000</a>
          <p style="font-size:.78rem;color:var(--gray);margin-top:12px">신청하시면 상담원이 공실·비용을 확인해 연락드립니다.</p>
        </div>
      </aside>
    </div></div>

    <div class="wrap" style="padding-bottom:50px">
      <div class="section-head"><h2>같은 지역의 다른 기관</h2></div>
      <div class="facility-list" id="similar"><p style="color:var(--gray)">불러오는 중…</p></div>
    </div>`;

    try {
      const sr = await fetch(`/api/facilities?sido=${encodeURIComponent(f.sido||'')}&type=${encodeURIComponent(f.type_label||'')}&size=4`);
      const sd = await sr.json();
      const others = (sd.items || []).filter(x => x.id !== f.id).slice(0, 3);
      document.getElementById("similar").innerHTML = others.length
        ? others.map(facilityCardHTML).join("")
        : `<p style="color:var(--gray)">표시할 기관이 없습니다.</p>`;
    } catch (e) {
      document.getElementById("similar").innerHTML = "";
    }
  }

  function notFound() {
    root.innerHTML = `<div class="wrap" style="padding:60px 20px;text-align:center">
      <h1>기관을 찾을 수 없습니다</h1>
      <p style="margin:12px 0 20px;color:var(--gray)">주소가 잘못되었거나 삭제된 기관입니다.</p>
      <a href="search.html" class="btn btn-green">시설 검색으로 돌아가기</a></div>`;
  }
</script>
</body>
</html>
