<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시설 상세 | 120 라이프홈즈</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=20260901b">
</head>
<body style="font-family:'Noto Sans KR',sans-serif">
<div id="chrome-header"></div>

<main id="detail"><div class="wrap" style="padding:60px 20px;text-align:center;color:var(--gray)">불러오는 중…</div></main>

<div id="chrome-footer"></div>

<script src="assets/js/regioncodes.js?v=20260901b"></script>
<script src="assets/js/data.js?v=20260901b"></script>
<script src="assets/js/app.js?v=20260901b"></script>
<script>
  mountChrome("");
  const id = qs().id;
  const root = document.getElementById("detail");

  render();
  async function render() {
    if (!id) return notFound();
    let f;
    try {
      const r = await fetch("/api/facility?id=" + encodeURIComponent(id));
      if (!r.ok) return notFound();
      const data = await r.json();
      f = data.item;
      if (!f) return notFound();
    } catch (e) { return notFound(); }

    document.title = `${cleanName(f.name)} | 120 라이프홈즈`;
    const c = typeColor(f.type_label);
    const sgg = f.sigungu_nm || (typeof sigunguName === "function" && sigunguName(f.sigungu)) || "";
    const region = [f.sido, sgg, f.dong_nm].filter(Boolean).join(" ");
    const kwByType = FACILITY_TYPES.find(t => t.name === f.type_label);
    const isResidential = ["노인요양시설", "노인요양공동생활가정"].includes(f.type_label);
    const fullRegion = [sidoFull(f.sido), sgg].filter(Boolean).join(" ");
    const mapQ = f.address || `${fullRegion} ${cleanName(f.name)}`.replace(/\s*\d+호점\s*$/, "").trim();
    const naverUrl = `https://map.naver.com/p/search/${encodeURIComponent(mapQ)}`;
    const kakaoUrl = `https://map.kakao.com/?q=${encodeURIComponent(mapQ)}`;
    const vacancy = (f.capacity != null && f.current_count != null) ? Math.max(f.capacity - f.current_count, 0) : null;
    const gcol = { A: "#1f8a4c", B: "#3a9bd4", C: "#e0912f", D: "#c0663a", E: "#b5546a" }[f.eval_grade] || "#6a7a8a";

    root.innerHTML = `
    <div class="detail-hero"><div class="wrap">
      <div class="breadcrumb"><a href="index.html">홈</a> › <a href="search.html?sido=${encodeURIComponent(f.sido||'')}">${esc(region)}</a> › <a href="search.html?type=${encodeURIComponent(f.type_label||'')}">${esc(f.type_label||'장기요양기관')}</a> › ${esc(cleanName(f.name))}</div>
      <div class="type-label">${esc(f.type_label || '장기요양기관')}</div>
      <h1>${esc(cleanName(f.name))}</h1>
      <div style="color:var(--gray)">${esc(region)}${f.address ? ' · ' + esc(f.address) : ''}</div>
    </div></div>

    <div class="wrap"><div class="detail-grid">
      <div class="detail-main">
        <div class="gallery">
          <div style="background:linear-gradient(135deg,${c},${c}bb);position:relative;display:flex;align-items:center;justify-content:center">
            <span style="font-size:5rem;filter:drop-shadow(0 4px 8px rgba(0,0,0,.2))">${typeEmoji(f.type_label)}</span>
            <img src="assets/symbol.svg?v=1" alt="" style="position:absolute;right:16px;top:16px;width:44px;opacity:.4;filter:brightness(0) invert(1)">
          </div>
          <div style="background:${c}88"></div><div style="background:${c}66"></div>
          <div style="background:${c}aa"></div><div style="background:${c}55"></div>
        </div>
        <p style="font-size:.8rem;color:var(--gray);margin:-14px 0 20px">시설 실제 사진은 제휴 시 제공됩니다. 현재는 유형 이미지로 표시됩니다.</p>

        <div class="detail-section">
          <h2>기본 정보</h2>
          <table class="spec-table">
            <tr><th>기관명</th><td>${esc(cleanName(f.name))} <span style="color:var(--gray);font-size:.82rem">(등록명: ${esc(f.name)})</span></td></tr>
            <tr><th>유형</th><td>${esc(f.type_label || '장기요양기관')}</td></tr>
            <tr><th>전화</th><td>${f.phone ? esc(f.phone) : '<span style="color:var(--gray)">보강 중</span>'}</td></tr>
            <tr><th>주소</th><td>
              ${f.address ? esc(f.address) : (esc(region) || '<span style="color:var(--gray)">주소 보강 중</span>')}
              ${f.post_no ? ` <span style="color:var(--gray);font-size:.9rem">(우편 ${esc(f.post_no)})</span>` : ''}
              <div style="margin-top:6px;font-size:.9rem">
                <a href="${naverUrl}" target="_blank" rel="noopener" style="color:var(--green);font-weight:700">네이버 지도 ↗</a>
                &nbsp;·&nbsp;
                <a href="${kakaoUrl}" target="_blank" rel="noopener" style="color:var(--green);font-weight:700">카카오맵 ↗</a>
              </div></td></tr>
            ${f.eval_grade ? `<tr><th>평가등급</th><td>
              <span style="background:${gcol};color:#fff;border-radius:5px;padding:2px 10px;font-weight:800">${esc(f.eval_grade)}</span>
              <span style="color:var(--gray);font-size:.88rem"> · 국민건강보험공단 정기평가${f.eval_date ? ' (' + ymd(f.eval_date) + ')' : ''}</span></td></tr>` : ''}
            <tr><th>장기요양기관기호</th><td>${esc(f.id)}</td></tr>
            <tr><th>지정일</th><td>${f.established_at ? ymd(f.established_at) : '-'}</td></tr>
          </table>
          ${kwByType ? `<p style="margin-top:12px;color:var(--gray);font-size:.95rem">${kwByType.desc}</p>` : ''}
        </div>

        ${isResidential ? `
        <div class="detail-section">
          <h2>정원 · 현원</h2>
          ${f.capacity != null ? `
          <table class="spec-table">
            <tr><th>정원</th><td><strong>${f.capacity}명</strong></td></tr>
            <tr><th>현원</th><td>${f.current_count != null ? f.current_count + '명' : '-'}</td></tr>
            <tr><th>정원 대비 여유</th><td>${vacancy != null ? '<strong style="color:var(--green-dark)">약 ' + vacancy + '명</strong>' : '-'} <span style="color:var(--gray);font-size:.85rem">(실제 입소 가능 여부는 시설 확인 필요)</span></td></tr>
          </table>
          <p style="font-size:.82rem;color:var(--gray);margin-top:8px">※ 국민건강보험공단 상세조회 데이터. 갱신 시점에 따라 실제와 차이가 있을 수 있습니다.</p>
          ` : `<p style="color:var(--gray)">정원·현원 정보를 보강 중입니다.</p>`}
        </div>` : ''}

        <div class="detail-section">
          <h2>더 자세한 정보가 필요하신가요?</h2>
          <p style="color:var(--gray)">
            프로그램, 인력 현황, 월 비용, <strong>실제 입소 가능 여부</strong>는 시설마다 다르고 수시로 바뀝니다.
            아래 <strong>견학·상담 신청</strong>을 이용하시면 상담원이 직접 확인해 정리해 드립니다.
          </p>
        </div>

        <div class="detail-section">
          <h2>이용 안내</h2>
          <p style="color:var(--gray)">
            장기요양 1~5등급 또는 인지지원등급 판정을 받은 어르신이 이용할 수 있습니다.
            등급이 없다면 <a href="guide.html" style="color:var(--green);font-weight:700">장기요양등급 신청</a>을 먼저 진행하세요.
          </p>
        </div>
      </div>

      <aside>
        <div class="aside-card">
          <div style="color:var(--gray);font-size:.85rem">${esc(f.type_label || '장기요양기관')}</div>
          <div style="font-size:1.4rem;font-weight:800;margin:4px 0 12px">${esc(cleanName(f.name))}</div>
          <ul class="mini">
            <li><span>지역</span><strong>${esc(region) || '준비중'}</strong></li>
            <li><span>전화</span><strong>${f.phone ? esc(f.phone) : '준비중'}</strong></li>
            ${isResidential && f.capacity != null
              ? `<li><span>정원 / 현원</span><strong>${f.capacity} / ${f.current_count != null ? f.current_count : '-'}명</strong></li>`
              : `<li><span>지정일</span><strong>${f.established_at ? ymd(f.established_at) : '-'}</strong></li>`}
          </ul>
          <a href="consult.html?facility=${encodeURIComponent(cleanName(f.name))}" class="btn btn-primary btn-block">견학 · 상담 신청</a>
          <a href="consult.html" class="btn btn-ghost btn-block" style="margin-top:8px">전화 상담 1600-0000</a>
          <p style="font-size:.78rem;color:var(--gray);margin-top:12px">신청하시면 상담원이 공실·비용을 확인해 연락드립니다.</p>
        </div>
      </aside>
    </div></div>

    <div class="wrap" style="padding-bottom:50px">
      <div class="section-head"><h2>같은 지역의 다른 기관</h2></div>
      <div class="facility-list" id="similar"><p style="color:var(--gray)">불러오는 중…</p></div>
    </div>`;

    try {
      const sr = await fetch(`/api/facilities?sido=${encodeURIComponent(f.sido||'')}&type=${encodeURIComponent(f.type_label||'')}&size=4`);
      const sd = await sr.json();
      const others = (sd.items || []).filter(x => x.id !== f.id).slice(0, 3);
      document.getElementById("similar").innerHTML = others.length
        ? others.map(facilityCardHTML).join("")
        : `<p style="color:var(--gray)">표시할 기관이 없습니다.</p>`;
    } catch (e) {
      document.getElementById("similar").innerHTML = "";
    }
  }

  function notFound() {
    root.innerHTML = `<div class="wrap" style="padding:60px 20px;text-align:center">
      <h1>기관을 찾을 수 없습니다</h1>
      <p style="margin:12px 0 20px;color:var(--gray)">주소가 잘못되었거나 삭제된 기관입니다.</p>
      <a href="search.html" class="btn btn-green">시설 검색으로 돌아가기</a></div>`;
  }
</script>
</body>
</html>
