# 요양병원(HIRA) 어댑터 테스트 — feature/hospital-hira-adapter 전용
#  · 시크릿 없음 (DATA_GO_KR_KEY / SUPABASE_* 미사용). API 실호출·DB 접근 없음.
#  · node --test (Node 20.x = 20.11+ 내장 러너). 무의존성.
#  · main / production / 배포에 영향 없음.
name: hira-tests

on:
  push:
    branches: ['feature/hospital-hira-adapter']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: node version (must be >= 20.11 for recursive --test)
        run: |
          node --version
          node -e 'const [maj,min]=process.versions.node.split(".").map(Number); if(maj<20||(maj===20&&min<11)){console.error("need >= 20.11");process.exit(1)}'

      - name: syntax check (node --check on all api/ + lib/)
        run: |
          set -e
          fail=0
          for f in $(find api lib -name '*.js'); do
            node --check "$f" && echo "ok   $f" || { echo "FAIL $f"; fail=1; }
          done
          exit $fail

      - name: unit tests (node --test test/)
        run: node --test test/
