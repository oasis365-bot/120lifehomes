# 요양병원(HIRA) 어댑터 + lib/db 키호환 + LTC 회귀 정적 테스트
#  · 시크릿 없음 (DATA_GO_KR_KEY / SUPABASE_* 미사용). API 실호출·DB 접근 없음.
#  · node --check (api/ + lib/ 전 파일) + node --test (Node 20.x 내장 러너). 무의존성.
#  · 빌드·배포·환경변수에 영향 없음 (테스트만).
#
#  트리거:
#   · push  → main, feature/hospital-hira-adapter
#   · pull_request → base 가 main 인 모든 PR
#   · 수동 (workflow_dispatch)
#  중복 방지: concurrency group 을 브랜치명으로 정규화(head_ref || ref_name).
#   → feature 브랜치에 push + 그 브랜치의 PR 이 동시에 트리거돼도 같은 group 이라
#     먼저 뜬 run 이 취소되고 최신 run 하나만 남는다. main push 는 group 'main' 로 독립.
name: hira-tests

on:
  push:
    branches: ['main', 'feature/hospital-hira-adapter']
  pull_request:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: hira-tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: node version (>= 20.11)
        run: |
          node --version
          node -e 'const [maj,min]=process.versions.node.split(".").map(Number); if(maj<20||(maj===20&&min<11)){console.error("need >= 20.11");process.exit(1)}'

      - name: syntax check (node --check on all api/ + lib/)
        run: |
          set -e
          fail=0
          for f in $(find api lib -name '*.js'); do
            node --check "$f" && echo "ok   $f" || { echo "FAIL $f"; fail=1; }
          done
          exit $fail

      - name: unit tests
        # test/db.test.mjs + test/hira/ — test/compare_facilities_api.mjs (라이브 URL 인자 필요) 는 제외.
        # (node 20.x 는 --test glob 미지원 → 파일/디렉터리 명시)
        run: node --test test/db.test.mjs test/hira/
