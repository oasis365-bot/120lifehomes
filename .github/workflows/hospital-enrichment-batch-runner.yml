# 전국 요양병원 enrichment(PR #19, /api/hospital/batch)를 예약 실행으로 이어서
# 완료시킨다. 이 워크플로 자체는 HTTP 호출 1회만 하고, 중단·재개·일일 HIRA
# 호출 한도·재시도는 서버(hospital_collection_jobs 의 lease + daily_usage RPC,
# runEnrichmentItem 의 재시도/backoff)가 이미 원자적으로 처리한다 — 여기서는
# 그 안전한 API를 "누가 계속 불러줄지"만 담당한다.
#
#  · 시크릿: HOSPITAL_BATCH_CRON_SECRET(필수), VERCEL_PROTECTION_BYPASS(이 프로젝트는
#    Vercel Authentication이 전체 Preview에 걸려 있어 사실상 필수) — 둘 다 GitHub
#    Secrets로만 저장하고, 스크립트는 이 값을 절대 로그에 남기지 않는다.
#  · 대상 URL: vars.HOSPITAL_BATCH_BASE_URL. main은 Production으로 배포되고 이
#    API는 Production에서 항상 404이므로 Preview를 가리켜야 한다. 단, PR 브랜치
#    (fix/**, feature/**)의 Preview URL은 그 PR이 병합·삭제되면 같이 사라지는
#    "임시" 주소다 — 여기 넣지 말 것. 운영자가 별도로 유지하는 안정적인 대상
#    (예: main과 계속 동기화하는 전용 장기 브랜치의 Preview 별칭, 또는 Vercel에서
#    수동으로 재지정하는 고정 별칭 도메인)을 넣어야 한다. PR #20 본문에 두
#    방식을 정리해 뒀다.
#  · 예약 실행은 지연·건너뜀이 있을 수 있다(GitHub 문서에 명시된 동작) — 이
#    워크플로는 그걸 막으려 하지 않고, 놓친 tick은 다음 tick이 그대로 이어받게만
#    설계했다(서버 쪽 상태가 항상 재개 가능하므로 정확한 시각 보장이 필요 없음).
#  · 중복 실행 방지: concurrency group으로 겹치는 실행을 "취소"가 아니라 "대기열"
#    시켜, 같은 시각에 두 tick이 동시에 API를 부르지 않게 한다(서버 lease가
#    최후 방어선이지만, Actions 쪽에서도 애초에 동시 호출을 만들지 않는다). 다만
#    대기열이 여러 건 쌓이면 GitHub는 가장 최근 것만 남기고 중간 것들은 건너뛴다
#    — 15분 간격·초 단위로 끝나는 이 작업 특성상 실질적으로는 거의 안 겹친다.
#  · 인증 실패(401)·설정 오류(409/500/501/503)·200인데 응답 형태가 이상한 경우
#    모두 scripts/run_enrichment_batch.mjs가 0이 아닌 종료코드로 끝내 이 Job이
#    빨간불로 남는다 — "성공"으로 착각해 조용히 방치되는 경우가 없게 했다.
#  · 전체 스위치(vars.HOSPITAL_BATCH_SCHEDULE_ENABLED, 기본값 OFF): 이 값이
#    없거나 '1'이 아니면 스크립트는 API를 전혀 호출하지 않고 종료코드 0으로
#    끝난다(정상적인 "꺼져 있음" 상태이지 오류가 아니다). main에 병합돼 스케줄이
#    GitHub에 등록되고 15분마다 이 워크플로가 실제로 실행되기 시작해도, 이
#    변수를 운영자가 '1'로 켜기 전까지는 "병합 = 실제 수집 시작"이 되지 않는다.
#    검증 뒤 켤 때는 Settings → Secrets and variables → Actions → Variables에서
#    HOSPITAL_BATCH_SCHEDULE_ENABLED = 1 로 설정한다.
name: hospital-enrichment-batch-runner

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

concurrency:
  group: hospital-enrichment-batch-runner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    # 서버 자체 배치 루프 예산(45s) + Vercel maxDuration(60s) + 여유를 감안해도
    # 5분이면 충분하다 — 그 이상 걸리면 이 tick은 포기하고 다음 tick에 맡긴다.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run one enrichment batch tick
        env:
          HOSPITAL_BATCH_SCHEDULE_ENABLED: ${{ vars.HOSPITAL_BATCH_SCHEDULE_ENABLED }}
          HOSPITAL_BATCH_BASE_URL: ${{ vars.HOSPITAL_BATCH_BASE_URL }}
          HOSPITAL_BATCH_CRON_SECRET: ${{ secrets.HOSPITAL_BATCH_CRON_SECRET }}
          VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
        run: node scripts/run_enrichment_batch.mjs
