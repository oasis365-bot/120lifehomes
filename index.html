<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>120 라이프홈즈 | 전국 요양시설·요양원·실버타운 검색</title>
<meta name="description" content="전국 5만 곳 이상의 요양원, 그룹홈, 주야간보호센터, 실버타운, 요양병원을 지역·비용·요양등급으로 검색하세요. 무료 입소 상담 제공.">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body style="font-family:'Noto Sans KR',sans-serif">
<div id="chrome-header"></div>

<main>
  <section class="hero">
    <div class="wrap">
      <h1>우리 가족을 위한 요양시설,<br><span class="hl">전국 52,000곳</span>에서 찾아보세요</h1>
      <p class="lead">지역, 월 이용료, 장기요양등급으로 조건에 맞는 요양원·그룹홈·주야간보호센터·실버타운을 한 번에 비교합니다.</p>
      <div class="stat-row">
        <div><strong>52,148</strong>등록 시설</div>
        <div><strong>17개</strong>시도 전역</div>
        <div><strong>무료</strong>입소 상담</div>
      </div>

      <div class="searchbox">
        <h2>🔍 조건으로 시설 찾기</h2>
        <form class="search-grid" action="search.html" method="get">
          <div class="field">
            <label for="region">지역</label>
            <select id="region" name="region"><option value="">전체 지역</option></select>
          </div>
          <div class="field">
            <label for="type">시설 유형</label>
            <select id="type" name="type"><option value="">전체 유형</option></select>
          </div>
          <div class="field">
            <label for="level">장기요양등급</label>
            <select id="level" name="level"><option value="">등급 선택 안 함</option></select>
          </div>
          <div class="field">
            <label for="fee">월 이용료</label>
            <select id="fee" name="fee">
              <option value="">상관없음</option>
              <option value="50">50만 원 이하</option>
              <option value="100">100만 원 이하</option>
              <option value="150">150만 원 이하</option>
              <option value="200">200만 원 이하</option>
              <option value="300">300만 원 이하</option>
            </select>
          </div>
          <div class="search-actions" style="grid-column:1/-1">
            <button type="submit" class="btn btn-primary btn-lg">시설 검색</button>
            <a href="consult.html" class="btn btn-ghost btn-lg">어떤 시설이 맞을지 상담받기</a>
          </div>
        </form>
        <div class="quick-tags" id="quickTags"><span>인기 검색 :</span></div>
      </div>
    </div>
  </section>

  <section class="block">
    <div class="wrap">
      <div class="section-head"><h2>지역으로 찾기</h2><a class="more" href="search.html">전체 보기 →</a></div>
      <div class="region-grid" id="regionGrid"></div>
    </div>
  </section>

  <section class="block alt">
    <div class="wrap">
      <div class="section-head"><h2>시설 유형 알아보기</h2><a class="more" href="guide.html">유형별 차이 가이드 →</a></div>
      <div class="type-grid" id="typeGrid"></div>
    </div>
  </section>

  <section class="block">
    <div class="wrap">
      <div class="section-head"><h2>테마별 특집</h2></div>
      <div class="collection-grid" id="collectionGrid"></div>
    </div>
  </section>

  <section class="block alt">
    <div class="wrap">
      <div class="section-head"><h2>새로 등록된 시설</h2><a class="more" href="search.html">더 보기 →</a></div>
      <div class="facility-list" id="newFacilities"></div>
    </div>
  </section>

  <section class="block">
    <div class="wrap" style="max-width:820px">
      <div class="section-head"><h2>자주 묻는 질문</h2></div>
      <div id="faqList"></div>
    </div>
  </section>
</main>

<div id="chrome-footer"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
  mountChrome("");

  // 셀렉트 채우기
  const rSel = document.getElementById("region");
  REGIONS.forEach(r => rSel.add(new Option(`${r.name} (${r.count.toLocaleString()})`, r.code)));
  const tSel = document.getElementById("type");
  FACILITY_TYPES.forEach(t => tSel.add(new Option(t.name, t.code)));
  const lSel = document.getElementById("level");
  CARE_LEVELS.forEach(l => lSel.add(new Option(l.name, l.code)));

  // 인기 검색 태그
  const qt = document.getElementById("quickTags");
  [["입소금 0원", "search.html?feature=" + encodeURIComponent("입소금 없음")],
   ["치매 전담 케어", "search.html?type=dementia"],
   ["주야간보호센터", "search.html?type=daycare"],
   ["반려동물 동반", "search.html?feature=" + encodeURIComponent("반려동물 동반")],
   ["실버타운", "search.html?type=silvertown"]].forEach(([label, href]) => {
    const a = document.createElement("a"); a.href = href; a.textContent = label; qt.appendChild(a);
  });

  // 지역 그리드
  document.getElementById("regionGrid").innerHTML = REGIONS.map(r =>
    `<a href="search.html?region=${r.code}">${r.name}<small>${r.count.toLocaleString()}곳</small></a>`).join("");

  // 유형 그리드
  document.getElementById("typeGrid").innerHTML = FACILITY_TYPES.slice(0, 9).map(t =>
    `<a class="type-card" href="search.html?type=${t.code}">
       <div class="ico">${t.icon}</div><h3>${t.name}</h3><p>${t.desc}</p>
     </a>`).join("");

  // 컬렉션
  document.getElementById("collectionGrid").innerHTML = COLLECTIONS.map(c => {
    const i = c.q.indexOf("=");
    const href = "search.html?" + c.q.slice(0, i) + "=" + encodeURIComponent(c.q.slice(i + 1));
    return `<a class="collection-card" style="background:linear-gradient(135deg,${c.c1},${c.c2})" href="${href}">
       <h3>${c.title}</h3><p>${c.desc}</p>
     </a>`;
  }).join("");

  // 새 시설 (3개)
  document.getElementById("newFacilities").innerHTML =
    FACILITIES.filter(f => ["f09", "f04", "f11"].includes(f.id)).map(facilityCardHTML).join("");

  // FAQ
  document.getElementById("faqList").innerHTML = FAQS.map(f =>
    `<details class="faq-item"><summary>${f.q}</summary><div class="ans">${f.a}</div></details>`).join("");
</script>
</body>
</html>
