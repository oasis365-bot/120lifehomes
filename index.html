<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>120 라이프홈즈 | 전국 요양시설·장기요양기관 검색</title>
<meta name="description" content="전국 2만 7천여 개 장기요양기관(요양원·그룹홈·주야간보호·방문요양)을 지역과 유형으로 검색하세요. 국민건강보험공단 공공데이터 기반. 무료 입소 상담 제공.">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=20260901d">
</head>
<body style="font-family:'Noto Sans KR',sans-serif">
<div id="chrome-header"></div>

<main>
  <section class="hero">
    <div class="wrap">
      <h1>우리 가족을 위한 요양시설,<br><span class="hl">전국 31,000곳</span>에서 찾아보세요</h1>
      <p class="lead">국민건강보험공단 공공데이터 기반으로 전국 장기요양기관을 지역·유형으로 검색합니다.</p>
      <div class="stat-row">
        <div><strong>31,028</strong>등록 기관</div>
        <div><strong>17개</strong>시도 전역</div>
        <div><strong>무료</strong>입소 상담</div>
      </div>

      <div class="searchbox">
        <h2>🔍 조건으로 시설 찾기</h2>
        <form class="search-grid" action="search.html" method="get" style="grid-template-columns:1fr 1fr 1fr">
          <div class="field">
            <label for="sido">지역</label>
            <select id="sido" name="sido"><option value="">전체 지역</option></select>
          </div>
          <div class="field">
            <label for="type">시설 유형</label>
            <select id="type" name="type"><option value="">전체 유형</option></select>
          </div>
          <div class="field">
            <label for="q">기관명</label>
            <input id="q" name="q" type="text" placeholder="예) 행복요양원">
          </div>
          <div class="search-actions" style="grid-column:1/-1">
            <button type="submit" class="btn btn-primary btn-lg">시설 검색</button>
            <a href="consult.html" class="btn btn-ghost btn-lg">어떤 시설이 맞을지 상담받기</a>
          </div>
        </form>
        <div class="quick-tags" id="quickTags"><span>인기 검색 :</span></div>
      </div>
    </div>
  </section>

  <section class="block">
    <div class="wrap">
      <div class="section-head"><h2>지역으로 찾기</h2><a class="more" href="search.html">전체 보기 →</a></div>
      <div class="region-grid" id="regionGrid"></div>
    </div>
  </section>

  <section class="block alt">
    <div class="wrap">
      <div class="section-head"><h2>시설 유형 알아보기</h2><a class="more" href="guide.html">유형별 차이 가이드 →</a></div>
      <div class="type-grid" id="typeGrid"></div>
    </div>
  </section>

  <section class="block">
    <div class="wrap">
      <div class="section-head"><h2>유형별 바로가기</h2></div>
      <div class="collection-grid" id="collectionGrid"></div>
    </div>
  </section>

  <section class="block alt">
    <div class="wrap">
      <div class="section-head"><h2>최근 지정된 기관</h2><a class="more" href="search.html?sort=new">더 보기 →</a></div>
      <div class="facility-list" id="newFacilities"><p style="color:var(--gray)">불러오는 중…</p></div>
    </div>
  </section>

  <section class="block">
    <div class="wrap" style="max-width:820px">
      <div class="section-head"><h2>자주 묻는 질문</h2></div>
      <div id="faqList"></div>
    </div>
  </section>
</main>

<div id="chrome-footer"></div>

<script src="assets/js/regioncodes.js?v=20260901d"></script>
<script src="assets/js/data.js?v=20260901d"></script>
<script src="assets/js/app.js?v=20260901d"></script>
<script>
  mountChrome("");

  const sSel = document.getElementById("sido");
  REGIONS.forEach(r => sSel.add(new Option(r.count ? `${r.name} (${r.count.toLocaleString()})` : `${r.name} (준비중)`, r.name)));
  const tSel = document.getElementById("type");
  FACILITY_TYPES.forEach(t => tSel.add(new Option(t.label, t.name)));

  const qt = document.getElementById("quickTags");
  [["요양원", "노인요양시설"], ["그룹홈", "노인요양공동생활가정"], ["주야간보호", "주야간보호"],
   ["방문요양", "방문요양"], ["단기보호", "단기보호"]].forEach(([label, type]) => {
    const a = document.createElement("a");
    a.href = "search.html?type=" + encodeURIComponent(type);
    a.textContent = label; qt.appendChild(a);
  });

  document.getElementById("regionGrid").innerHTML = REGIONS.map(r =>
    `<a href="search.html?sido=${encodeURIComponent(r.name)}">${r.name}<small>${r.count ? r.count.toLocaleString() + "곳" : "준비중"}</small></a>`).join("");

  document.getElementById("typeGrid").innerHTML = FACILITY_TYPES.map(t =>
    `<a class="type-card" href="search.html?type=${encodeURIComponent(t.name)}">
       <div class="ico">${t.icon}</div><h3>${t.label}</h3><p>${t.desc}</p>
     </a>`).join("");

  document.getElementById("collectionGrid").innerHTML = COLLECTIONS.map(c => {
    const i = c.q.indexOf("=");
    const href = "search.html?" + c.q.slice(0, i) + "=" + encodeURIComponent(c.q.slice(i + 1));
    return `<a class="collection-card" style="background:linear-gradient(135deg,${c.c1},${c.c2})" href="${href}">
       <h3>${c.title}</h3><p>${c.desc}</p></a>`;
  }).join("");

  document.getElementById("faqList").innerHTML = FAQS.map(f =>
    `<details class="faq-item"><summary>${f.q}</summary><div class="ans">${f.a}</div></details>`).join("");

  // 최근 지정된 기관
  fetch("/api/facilities?sort=new&size=3")
    .then(r => r.json())
    .then(d => {
      const el = document.getElementById("newFacilities");
      el.innerHTML = (d.items && d.items.length)
        ? d.items.map(facilityCardHTML).join("")
        : `<p style="color:var(--gray)">준비 중입니다.</p>`;
    })
    .catch(() => { document.getElementById("newFacilities").innerHTML = ""; });
</script>
</body>
</html>
